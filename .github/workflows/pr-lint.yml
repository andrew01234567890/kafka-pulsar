name: PR Lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate PR title and description
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title || '';
            const body = (context.payload.pull_request.body || '').trim();
            const errors = [];
            if (!/^\[[0-9]+\.[0-9]+\.[0-9]+\] .+/.test(title)) {
              errors.push('PR title must match "[MAJOR.MINOR.PATCH] Descriptive Title", e.g. "[1.4.0] Add Fetch API".');
            }
            if (body.length === 0) {
              errors.push('PR description/body must not be empty.');
            }
            if (errors.length) {
              core.setFailed(errors.join('\n'));
            } else {
              core.info('PR title and description OK.');
            }
